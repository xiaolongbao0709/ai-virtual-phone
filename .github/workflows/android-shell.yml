name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "要加载的自部署站点地址（https://…）"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    # 可选签名：仓库 Secrets 配置了 SHELL_KEYSTORE_BASE64 等四项时产出已签名 release
    env:
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Decode keystore (optional)
        if: ${{ env.SHELL_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$SHELL_KEYSTORE_BASE64" | base64 -d > /tmp/shell.keystore
          echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        run: gradle -p android-shell assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release
          path: android-shell/app/build/outputs/apk/release/*.apk
