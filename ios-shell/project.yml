name: FloatShell
options:
  bundleIdPrefix: app.floatphone
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    SUPPORTS_MACCATALYST: NO

targets:
  FloatShell:
    type: application
    platform: iOS
    sources:
      - path: FloatShell
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.floatphone.shell
        PRODUCT_NAME: FloatShell
        INFOPLIST_FILE: FloatShell/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO

schemes:
  FloatShell:
    build:
      targets:
        FloatShell: all
    run:
      config: Release
    archive:
      config: Release
